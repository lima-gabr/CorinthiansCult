<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Corinthians Cult</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon.png">
</head>

<body>
<header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-corinthians-dark py-3">
            <div class="container">
                <a class="navbar-brand" href="../index.html">
                    <img src="../assets/images/corinthians.png" alt="Corinthians Cult">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainHeader">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse gap-3" id="mainHeader">
                    <div class="d-none d-lg-block" style="width: 130px;"></div>

                    <form class="d-flex flex-column flex-lg-row align-items-center my-3 my-lg-0 mx-auto w-100" id="search-form" role="search" style="max-width: 600px;">
                        <div class="input-group w-100 shadow-sm">
                            <select class="form-select form-select-sm flex-grow-0 bg-light border-0" style="width: 70px;" id="state-select"><option value="SP">SP</option><option value="RJ">RJ</option></select>
                            <div style="width: 1px; background: #ccc;"></div>
                            <select class="form-select form-select-sm flex-grow-0 bg-light border-0" style="width: 110px;" id="city-select"><option value="SaoPaulo">São Paulo</option><option value="Campinas">Campinas</option><option value="Rio">R. Janeiro</option></select>
                            <input class="form-control border-0" type="search" id="search-input" placeholder="Buscar eventos..." aria-label="Search">
                            <button class="btn bg-white border-0" type="submit"><img src="https://api.iconify.design/bi:search.svg?color=%23504375" alt="Buscar" style="width: 18px; height: 18px;"></button>
                        </div>
                        <button class="btn btn-secondary w-100 d-lg-none mt-2" type="submit">Buscar</button>
                    </form>

                    <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center justify-content-lg-end mt-3 mt-lg-0" id="auth-nav-links" style="min-width: 180px;">
                        <a href="../login.html" class="btn btn-secondary btn-sm fw-bold px-4 py-2 w-100 w-lg-auto">Login / Cadastro</a>
                    </div>
                </div>
            </div>
        </nav>

        <div class="sub-nav">
            <div class="container">
                <ul class="nav justify-content-center flex-nowrap overflow-auto pb-1 pb-md-0">
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Todos">Todos</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Filmes">Filmes</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Shows">Shows</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Palestras">Palestras</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Peças">Peças</a></li>
                    <li class="nav-item"><a class="nav-link text-nowrap" href="../events.html?category=Exposições">Exposições</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <div class="container dashboard-grid py-4">
            <div class="row">
                <div class="col-md-3 mb-4">
                    <div class="list-group dashboard-nav">
                        <a href="./index.html" class="list-group-item list-group-item-action active">Visão Geral</a>
                        <a href="./event-form.html" class="list-group-item list-group-item-action">Cadastrar Evento</a>
                    </div>
                </div>
                <div class="col-md-9">
                    <section class="dashboard-content">
                        <h1 class="mb-4">Painel Administrativo</h1>
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <a href="./event-form.html" class="btn btn-primary">Cadastrar Novo Evento</a>
                            <button id="export-csv-btn" class="btn btn-outline-secondary">Exportar CSV
                                (Simulado)</button>
                        </div>
                        <h2 class="h4 mb-3">Eventos Cadastrados</h2>
                        <div class="table-responsive bg-white rounded shadow-sm p-3">
                            <table class="table table-hover align-middle admin-table mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Evento</th>
                                        <th>Categoria</th>
                                        <th class="text-center">Vendidos</th>
                                        <th class="text-center">Total</th>
                                        <th class="text-center">Status</th>
                                        <th class="text-end">Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-events-tbody"></tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container text-center py-3">
            <p>&copy; 2025 Corinthians Cult.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>

</html>
